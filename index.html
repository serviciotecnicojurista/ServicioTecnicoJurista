<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: #222;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .imagen {
            width: 100%;
            height: 350px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagen img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 🔴 CLAVE: no recorta la imagen */
        }

        .botones {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .whatsapp {
            background-color: #25D366;
        }

        .gmail {
            background-color: #d93025;
        }
    </style>
</head>

<body>

<header>
    <h1>Nuestros Servicios</h1>
</header>

<nav>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contactos</a>
</nav>

<div class="container">

    <div class="imagen">
        <!-- 🔴 Cambiá solo la ruta de la imagen si querés -->
        <img src="imagen.jpg" alt="Imagen del servicio">
    </div>

    <section id="servicios">
        <h2>Servicios</h2>
        <p>
            Somos padre e hijo y realizamos trabajos con responsabilidad y compromiso.
        </p>
    </section>

    <section id="contacto">
        <h2>Contactos</h2>

        <div class="botones">
            <!-- ❗ WhatsApp SIN CAMBIOS -->
            <a class="btn whatsapp" href="https://wa.me/5493413611579" target="_blank">
                Contactar por WhatsApp
            </a>

            <!-- ❗ Gmail SIN CAMBIOS -->
            <a class="btn gmail" href="mailto:serviciotecnicojurista@gmail.com">
                Enviar Gmail
            </a>
        </div>
    </section>

</div>

</body>
</html>
