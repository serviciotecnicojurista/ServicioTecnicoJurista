<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            background-color: #222;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        /* 🔴 SERVICIOS CON IMAGEN DE FONDO */
        .servicios {
            background-image: url("imagen.jpg"); /* ⬅ tu imagen */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; /* 🔴 NO se recorta */
            min-height: 350px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;
        }

        .servicios .contenido {
            background-color: rgba(0, 0, 0, 0.6); /* oscurece para leer */
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
        }

        .botones {
            margin: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .whatsapp {
            background-color: #25D366;
        }

        .gmail {
            background-color: #d93025;
        }
    </style>
</head>

<body>

<header>
    <h1>Nuestros Servicios</h1>
</header>

<nav>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contactos</a>
</nav>

<div class="container">

    <section id="servicios" class="servicios">
        <div class="contenido">
            <h2>Servicios</h2>
            <p>
                Somos padre e hijo y realizamos trabajos con responsabilidad y compromiso.
            </p>
        </div>
    </section>

    <section id="contacto">
        <div class="botones">
            <!-- WhatsApp -->
            <a class="btn whatsapp" href="https://wa.me/5493413611579" target="_blank">
                Contactar por WhatsApp
            </a>

            <!-- Gmail -->
            <a class="btn gmail" href="mailto:serviciotecnicojurista@gmail.com">
                Enviar Gmail
            </a>
        </div>
    </section>

</div>

</body>
</html>
